name: auto_build

# 两条触发线：
# 1. push 改动了规则源文件 → 立即构建
# 2. 每周一定时构建 → 重新拉上游订阅，上游有更新就自动发新版本（手机端随后自动拉取）
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/auto_build.yml'
  schedule:
    # 每周一 04:00（北京时间）= 周日 20:00 UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 想在 GitHub 网页上切上游，不用改代码：Settings → Variables 里加 GKD_UPSTREAM=official 即可
    env:
      GKD_UPSTREAM: ${{ vars.GKD_UPSTREAM }}
    # 跳过本工作流自己产生的提交，避免循环
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Commit dist
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist 无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -e "import('@gkd-kit/tools').then((m) => m.stdoutGkdVersion());")
          git commit -m "chore(release): v${version}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push dist
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: git push origin HEAD:main
